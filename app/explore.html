<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yaatra — Explore</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main>
  <div class="page-head">
    <h1>Explore Destinations</h1>
    <p>Find hotels, food, sightseeing and travel options for your next trip.</p>
  </div>

  <div class="card" style="margin-bottom:1rem">
    <div class="form-row">
      <input id="q" placeholder="Search destinations, e.g. Thiruvannamalai, Arunachala, beach…">
      <select id="tag"><option value="">All interests</option></select>
    </div>
  </div>

  <div class="grid grid-3" id="results"></div>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  // Aliases support transliteration-style search (spec §4.6)
  const ALIASES = { thiruvannamalai: ["tiruvannamalai", "arunachala", "annamalai", "திருவண்ணாமலை"], puducherry: ["pondicherry", "pondy"] };
  const tags = [...new Set(DESTINATIONS.flatMap(d => d.tags))];
  document.getElementById("tag").innerHTML += tags.map(t => `<option>${t}</option>`).join("");

  function render() {
    const q = document.getElementById("q").value.trim().toLowerCase();
    const tag = document.getElementById("tag").value;
    const list = DESTINATIONS.filter(d => {
      const hay = [d.name, d.region, d.summary, ...(ALIASES[d.id] || [])].join(" ").toLowerCase();
      return (!q || hay.includes(q)) && (!tag || d.tags.includes(tag));
    });
    document.getElementById("results").innerHTML = list.map(d => `
      <a class="card" href="destination.html?id=${d.id}" style="color:inherit;text-decoration:none">
        <div class="card-media">${d.emoji}</div>
        <h3>${d.name}</h3>
        <p class="muted">${d.region} · Best: ${d.bestSeason}</p>
        <p>${d.summary}</p>
        <div class="row">${d.tags.map(t => `<span class="chip">${t}</span>`).join("")}</div>
      </a>`).join("") || `<div class="card empty">No destinations match.</div>`;
  }

  document.getElementById("q").oninput = render;
  document.getElementById("tag").onchange = render;
  render();
</script>
</body>
</html>
